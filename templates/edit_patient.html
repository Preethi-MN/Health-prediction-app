<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient</title>
</head>
<body>

    <h2>Edit Patient</h2>

    <form method="POST">

        <label>Full Name</label><br>
        <input type="text" name="full_name"
               value="{{ patient.full_name }}" required>
        <br><br>

        <label>Date of Birth</label><br>
        <input type="date" name="dob"
               value="{{ patient.dob }}" required>
        <br><br>

        <label>Email</label><br>
        <input type="email" name="email"
               value="{{ patient.email }}" required>
        <br><br>

        <label>Glucose</label><br>
        <input type="number" step="0.01" name="glucose"
               value="{{ patient.glucose }}" required>
        <br><br>

        <label>Haemoglobin</label><br>
        <input type="number" step="0.01" name="haemoglobin"
               value="{{ patient.haemoglobin }}" required>
        <br><br>

        <label>Cholesterol</label><br>
        <input type="number" step="0.01" name="cholesterol"
               value="{{ patient.cholesterol }}" required>
        <br><br>

        <button type="submit">Update Patient</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
